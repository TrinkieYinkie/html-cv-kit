<article aria-label="CV page 1" class="sheet">
  <div class="description">
    <header class="page-header"><div class="header-line">
      <h1 class="name">{{name}}</h1>
      <div class="role-block"><p class="title">{{headline}}</p><p class="subtitle">{{subtitle}}</p></div>
    </div></header>
    <p class="note">{{note}}</p><div class="section">{{summary}}</div>
  </div>
  <div class="grid"><section class="experience-column">{{experience1}}</section><aside>{{sidebar1}}</aside></div>
  <footer aria-label="Page number" class="page-footer">1 / 2</footer>
</article>
<article aria-label="CV page 2" class="sheet next-page">
  <div class="grid"><section class="experience-column">{{experience2}}</section><aside>{{sidebar2}}</aside></div>
  <footer aria-label="Page number" class="page-footer">2 / 2</footer>
</article>
